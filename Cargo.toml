[workspace]
resolver = "2"

# Every layered crate is a member. A crate is added here only once it has a real
# Cargo.toml and compiles; a member missing from layers.toml fails the gate.
#
# The authoritative crate → layer map is `layers.toml`, which `cargo xtask
# verify-layering` reads. This comment is generated from it and checked against it;
# do not edit one without the other.
#
#   L0  aisme-ebpf-common
#   L1  aisme-core · aisme-correlate · aisme-compress · aisme-observer
#   L2  aisme-linux · aisme-tls · sentinel-core · aisme-sdkhost
#   L3  aisme-agentd (RSS budget 50 MB) · aisme-forensicd · aisme-loaderd
#   L4  aisme-cli · aisme-otel · aisme-relay · aisme-proto · aisme-clientcore ·
#       aisme-agentsim · xtask
#
# Not a member: crates/aisme-windows ([POST], ADR-02, plan Annex F).
# Not a crate:  crates/aisme-ebpf is built by `cargo xtask build-ebpf` with its own
#               pinned nightly (crates/aisme-ebpf/rust-toolchain.toml).
members = [
    "crates/aisme-ebpf-common",
    "crates/aisme-core",
    "crates/aisme-correlate",
    "crates/aisme-compress",
    "crates/aisme-observer",
    "crates/aisme-linux",
    "crates/aisme-tls",
    "crates/sentinel-core",
    "crates/aisme-sdkhost",
    "crates/aisme-agentd",
    "crates/aisme-forensicd",
    "crates/aisme-loaderd",
    "crates/aisme-cli",
    "crates/aisme-otel",
    "crates/aisme-relay",
    "crates/aisme-proto",
    "crates/aisme-clientcore",
    "crates/aisme-agentsim",
    "xtask",
]

# Inside the workspace directory but deliberately not members.
exclude = [
    "crates/aisme-ebpf",    # own pinned nightly, built by `cargo xtask build-ebpf`
    "crates/aisme-windows", # [POST] deferred by ADR-02; specification in plan Annex F
    "tests/probes/ebpf",    # §F0.4 verification probes; same pin and target as aisme-ebpf
]

[workspace.package]
edition = "2021"
# Apache-2.0 workspace-wide. Two crates override it because the kernel requires it:
#   crates/aisme-ebpf         GPL-2.0-only        (gpl_only helpers; verifier-enforced)
#   crates/aisme-ebpf-common GPL-2.0-only OR BSD-2-Clause  (shared with the kernel side)
# Map and reasoning: LICENSE.md, ADR-06.
license = "Apache-2.0"
repository = "https://github.com/ealcober/AI-SYSTEM-MONITOR"
rust-version = "1.87"   # aya 0.14 and aya-ebpf 0.2 both declare 1.87.0 (F0.VER.01)
# One sentence that has to stand alone: this is what a search result shows, with
# no README under it. The terms are the ones the field already uses — the papers
# and vendor pages a searcher will have read first — and none of them claims a
# capability the product does not have. "Sandbox" is deliberately absent: this
# is not one, and the threat model says so.
description = "Kernel-level runtime security for autonomous AI coding agents: eBPF and Landlock enforcement, tool-call attribution, and tamper-evident forensics."
# crates.io allows five, each at most twenty characters.
keywords = ["ebpf", "ai-agent", "security", "landlock", "seccomp"]
# From crates.io's fixed list; an invented category is rejected at publish time.
categories = ["os::linux-apis", "development-tools"]
readme = "README.md"
# Declared once here rather than in nineteen manifests: a crate inherits these
# with `description.workspace = true` on the day it is actually published, and
# no crate is today. GitHub reads none of them — it reads the repository's own
# description and topics, which are set in its settings and recorded in
# `docs/18`, because a topic list that lives only in somebody's memory does not
# survive the next rename.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"   # the local gate runs with -D warnings, so these are errors there (F0.GATE.02)

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Used by the 72 h soak and budget certification runs: release codegen with
# symbols retained so heaptrack/dhat profiles are readable.
[profile.bench-budget]
inherits = "release"
strip = "none"
debug = 1
