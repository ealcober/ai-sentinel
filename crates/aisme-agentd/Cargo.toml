[package]
name = "aisme-agentd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# L3 -> L1 and L0. Adapters are named only in src/platform, and only from
# their own phase (A-05); nothing here reaches sideways.
aisme-core = { path = "../aisme-core" }
aisme-ebpf-common = { path = "../aisme-ebpf-common" }
# H-03: the 50 MB budget is the product. mimalloc returns freed pages to the
# OS aggressively (MIMALLOC_PURGE_DELAY, set in main), which glibc's allocator
# does not: an arena that grows during a burst and never shrinks is how a
# daemon passes its budget on the bench and fails it after an hour.
mimalloc = { version = "0.1.52", default-features = false }

[lints]
workspace = true
