[package]
name = "aisme-agentd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# L3 -> L1 and L0. Adapters are named only in src/platform, and only from
# their own phase (A-05); nothing here reaches sideways.
aisme-core = { path = "../aisme-core" }
# L3 -> L1. aisme-proto is the control-plane *vocabulary* (Annex I types and a
# codec, no I/O, no platform, no runtime), which both an edge and an engine
# speak, so it cannot be an edge itself. It sat at L4 when F1.IPC.01 added this
# edge and verify-layering rejected it as upward; the fix was the layer table,
# not the dependency (layers.toml, §3.1's diagram, the Part VI tree).
aisme-proto = { path = "../aisme-proto" }
aisme-ebpf-common = { path = "../aisme-ebpf-common" }

# L3 -> L2, the one adapter edge, and it is named only in src/platform (A-05).
# Linux-only by target: aya does not build elsewhere, and keeping the target
# key here rather than a cfg in the source is what stops the dependency from
# existing at all on a platform that cannot use it.
[target.'cfg(target_os = "linux")'.dependencies]
aisme-linux = { path = "../aisme-linux" }
# H-03: the 50 MB budget is the product. mimalloc returns freed pages to the
# OS aggressively (MIMALLOC_PURGE_DELAY, set in main), which glibc's allocator
# does not: an arena that grows during a burst and never shrinks is how a
# daemon passes its budget on the bench and fails it after an hour.
mimalloc = { version = "0.1.52", default-features = false }
# Two worker threads, no more (F1.RT.02), and only the features the daemon
# uses: no net, no fs, no process — those would be I/O the adapters own.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
# SO_PEERCRED, and nothing else. std's `peer_cred` is still unstable
# (rust-lang#42839); the alternative was a large syscall wrapper crate in the
# budgeted daemon (DEP.SUP.06), and libc is already in the tree through tokio
# and mimalloc, so this adds no crate at all.
libc = "0.2.189"

[lints]
workspace = true
