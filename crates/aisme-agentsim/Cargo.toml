[package]
name = "aisme-agentsim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]

# L4 -> L1. The WAL replayer, so a trace can be recovered from what a session
# actually did (`F0.ASSET.02`). It is `aisme-core`'s and not `aisme-forensicd`'s:
# `forensicd` is L3 and cannot name this crate's trace format, and the replayer
# was never its to begin with.
aisme-core = { path = "../aisme-core" }
aisme-ebpf-common = { path = "../aisme-ebpf-common" }

# L4 -> L1, tests only. The replay writes the declaration by hand because it
# must be one line on a socket with no dependency in the shipped path; the test
# then parses it with the server's own parser, so the two cannot drift apart
# without a test failing.
[dev-dependencies]
aisme-proto = { path = "../aisme-proto" }

[lints]
workspace = true
