[package]
name = "aisme-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# L1 -> L0. The only direction permitted; verify-layering enforces it.
aisme-ebpf-common = { path = "../aisme-ebpf-common" }
# The policy digest (F1.PL.05) and, later, the Merkle leaves (§2.18, measured
# 6.4× over SHA-256 in F0.VER.13). No default features: pure Rust, no std
# assumptions, nothing platform-specific in L1.
blake3 = { version = "1.8.7", default-features = false }
# AISME-PL's surface syntax is TOML (Annex B §B.0: no new parser). toml_edit
# keeps byte spans, which the compiler's diagnostics (F1.PL.02) point at. Pure:
# no I/O, no platform, so it sits inside L1.
toml_edit = "0.25"

[lints]
workspace = true
