# Corpus manifest — plan §4.14. A corpus is a gate input, so an unversioned edit
# can turn a red build green. `cargo xtask verify-docs` recomputes `sha256` and
# fails when it disagrees with the content.
#
# `sha256` is over the corpus content, defined so it is reproducible: for every
# file under this directory except `manifest.toml` and `.gitkeep`, sorted by
# relative path, feed the path bytes, then a NUL, then the file bytes. An empty
# corpus therefore hashes the empty string.

# Labelled network flows for the Sentinel classifier. Parquet, metadata only: the row schema of §4.14.1 has no payload field, so `T4.11.05` is enforced by the shape of the data.

